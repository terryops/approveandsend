<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The mark is a check, and it is painted rather than drawn.

    Everything this desk does is a machine writing and a person deciding, and a
    geometric tick says only the first half: it is the mark a program makes.
    A brush stroke that swells at the turn and runs dry at the tip is the mark a
    hand makes, and "a human was here" is the whole product. It is also what
    keeps this off the shelf of identical to-do apps, all of which own the
    perfect two-segment tick.

    The path is one filled outline, not a stroked line. A stroke has one width;
    this has to be thin where the brush lands, heavy through the turn, and split
    into hairs where it leaves the paper, and only a filled silhouette can say
    that. It was traced from the painted original rather than redrawn by hand, so
    the shape on screen is the shape that was chosen, down to the flick.

    Olive is the token this app already uses for sent, which is what a tick here
    actually means. The ground is the same paper the desk is set on.

    The hairline is not decoration. On paper alone this icon is invisible in a
    light browser tab strip, which is very near the same near-white: the tile has
    no edge, so what survives is a green tick floating in the strip with no icon
    around it. Measured at 16px against Chrome's own strip colour, the app's
    faint line does nothing and a heavier one reads as a drawn frame; this middle
    token is the one that gives the tile an edge without becoming one. On a dark
    strip it costs nothing, since paper on near-black already has all the
    contrast there is.
  -->
  <rect width="64" height="64" rx="14" fill="#f2f0ec"/>
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="13.4" fill="none" stroke="#cfc9bf" stroke-width="1.2"/>
